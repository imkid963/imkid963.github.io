<!doctype html><html lang="ar"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>مغامرات عيال وليد</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عيال وليد">
<meta name="theme-color" content="#efdcb6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap">
<style>
/* Layout: full-screen open world; icon-only HUD at the top, minimap top-right, thumb controls at the bottom */
:root{
  --sand:#efdcb6; --sand-deep:#cfa774; --ink:#5a3519; --gold:#e6bf5c;
  --glass:rgba(255,250,240,.88); --shadow:rgba(90,53,25,.26);
  --display:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--sand);color:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.round{position:relative;display:grid;place-items:center;border-radius:50%;background:var(--glass);
  box-shadow:0 4px 0 var(--sand-deep),0 8px 18px var(--shadow);transition:transform .08s}
.round:active,.round.on{transform:translateY(3px);box-shadow:0 1px 0 var(--sand-deep),0 4px 10px var(--shadow)}
.round svg{width:56%;height:56%}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.grp{display:flex;gap:10px;align-items:center}
.small{width:46px;height:46px}
.pill{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:var(--glass);
  box-shadow:0 3px 0 var(--sand-deep),0 6px 14px var(--shadow);font-family:var(--display);font-weight:800;font-size:21px;
  font-variant-numeric:tabular-nums;direction:ltr}
.pill svg{width:26px;height:26px}
#fade{position:fixed;inset:0;background:#2a1a0e;opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1}
#mis .mi{pointer-events:auto;cursor:pointer}
#mini{cursor:pointer}
#bigmap{position:fixed;inset:0;direction:rtl;display:grid;place-items:center;background:rgba(239,220,182,.45);padding:12px;font-family:var(--display)}
#bigmap .mapwrap{position:relative;width:min(94vw,calc(100vh - 24px));height:min(94vw,calc(100vh - 24px))}
#bigc{width:100%;height:100%;border-radius:26px;touch-action:none;border:4px solid var(--glass);box-shadow:0 6px 0 var(--sand-deep),0 14px 34px var(--shadow);box-sizing:border-box}
.mapnote{position:absolute;left:58px;right:10px;top:12px;margin:auto;width:max-content;max-width:calc(100% - 70px);padding:5px 12px;border-radius:14px;background:var(--glass);font-size:13px;font-weight:800;text-align:center}
#mapDone{position:absolute;top:10px;left:10px}
.places{position:absolute;left:8px;right:8px;bottom:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.places button{padding:6px 12px;border-radius:14px;background:var(--glass);font-family:var(--display);font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--sand-deep)}
.places button:active{transform:translateY(2px)}
#mis{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.mi{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);
  box-shadow:0 2px 0 var(--sand-deep),0 4px 10px var(--shadow);border:3px solid var(--c);transition:background .3s,transform .3s}
.mi svg{width:70%;height:70%}
.mi.done{background:var(--c);transform:scale(1.06)}
.mi .ck{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;background:#fff;display:none;place-items:center;box-shadow:0 1px 4px var(--shadow)}
.mi.done .ck{display:grid}
.mi .dots{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);display:flex;gap:2px}
.mi .dots i{width:6px;height:6px;border-radius:50%;background:rgba(90,53,25,.25)}
.mi .dots i.on{background:var(--ink)}
#mini{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 66px);width:118px;height:118px;border-radius:50%;
  box-shadow:0 3px 0 var(--sand-deep),0 6px 16px var(--shadow);border:3px solid var(--glass);pointer-events:auto}
#jump{position:fixed;width:84px;height:84px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
#act{position:fixed;width:70px;height:70px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 124px)}
#act svg{width:62%;height:62%}
#fishBtn{position:fixed;width:64px;height:64px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 100px);bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
#fishBtn svg{width:62%;height:62%}
#power{position:fixed;width:64px;height:64px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 100px);bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
#sprint{position:fixed;width:66px;height:66px;right:calc(max(18px,env(safe-area-inset-right,0px)) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 208px)}
#timer{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px)}
#gear2{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:auto}
#lobby,#ward{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(560px,calc(100% - 32px));
  pointer-events:auto;background:var(--glass);border-radius:28px;padding:14px;box-shadow:0 6px 0 var(--sand-deep),0 14px 34px var(--shadow);font-family:var(--display)}
.ltitle{font-weight:800;font-size:20px;text-align:center;margin-bottom:10px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:18px;background:#fff8ec;font-weight:800;font-size:16px;border:3px solid transparent}
.mode small{font-weight:500;font-size:12px;opacity:.75}
.mode.on{border-color:var(--gold);background:#fff1cf}
.lrow{display:flex;gap:10px;margin-top:12px}
.lbtn{flex:1;padding:12px;border-radius:20px;background:#fff8ec;font-weight:800;font-size:19px;box-shadow:0 3px 0 var(--sand-deep)}
.lbtn.play{background:var(--gold);color:#4a2a10}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.witem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;background:#fff8ec;font-size:12px;font-weight:700;border:3px solid transparent}
.witem svg{width:38px;height:38px}
.witem.on{border-color:var(--gold);background:#fff1cf}
.pick.sel{background:var(--gold);color:#4a2a10}
#settings{position:fixed;inset:0;display:grid;place-items:center;background:rgba(239,220,182,.4);padding-inline:16px;font-family:var(--display)}
#settings .card{width:min(420px,100%);gap:12px;align-items:stretch}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:17px}
.seg{display:flex;gap:4px;background:#fff8ec;border-radius:16px;padding:4px}
.seg button{padding:7px 10px;border-radius:12px;font-weight:700;font-size:14px}
.seg button.on{background:var(--gold)}
#power .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(90,53,25,.32) var(--p,0%),transparent 0)}
#joy{position:fixed;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,240,.18) 0,rgba(255,250,240,.38) 100%);
  border:4px solid rgba(255,250,240,.85);box-shadow:0 4px 14px var(--shadow);pointer-events:none}
#joy{opacity:.32;transition:opacity .15s}
#joy.act{opacity:1;border-color:#fff;background:radial-gradient(circle,rgba(255,250,240,.25) 0,rgba(255,250,240,.5) 100%)}
#knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:var(--glass);box-shadow:0 4px 0 var(--sand-deep),0 6px 14px var(--shadow);transition:transform .08s}
#pop{position:fixed;left:50%;top:38%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);border:6px solid var(--c);box-shadow:0 8px 0 var(--sand-deep),0 18px 40px var(--shadow);pointer-events:none;animation:popin 1.9s ease both}
#pop svg{width:66%;height:66%}
#datesPill svg{width:24px;height:24px}
#catch{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);min-width:230px;padding:16px 26px 18px;border-radius:30px;background:var(--glass);
  border:6px solid var(--c,#9cc9c9);box-shadow:0 8px 0 var(--sand-deep),0 18px 40px var(--shadow);text-align:center;direction:rtl;font-family:var(--display);pointer-events:none;animation:catchin 2.6s ease both}
@keyframes catchin{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.9)}}
@media (max-height:480px){#sprint{right:calc(max(18px,env(safe-area-inset-right,0px)) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + 146px)}}
#catch svg{width:190px;height:96px;display:block;margin:0 auto}
#catch .fn{font-weight:800;font-size:34px;line-height:1.2}
#catch .nw{display:inline-block;margin-top:4px;padding:2px 12px;border-radius:12px;background:#e6bf5c;color:#5a3519;font-weight:800;font-size:16px}
#album{position:fixed;inset:0;direction:rtl;display:grid;place-items:center;background:rgba(239,220,182,.45);padding:16px;font-family:var(--display)}
#album .card{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;gap:12px;align-items:stretch}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.aitem{border-radius:20px;background:#fff8ec;padding:8px 6px 10px;text-align:center;box-shadow:0 3px 0 var(--sand-deep)}
.aitem svg{width:100%;height:56px}
.aitem b{display:block;font-size:18px}
.aitem small{font-size:15px;opacity:.75;direction:ltr;display:block}
.aitem.no b{opacity:.45}
#act.hot{animation:hot .5s ease-in-out infinite alternate}
@keyframes hot{to{transform:scale(1.16);box-shadow:0 0 0 8px rgba(230,191,92,.7),0 8px 18px var(--shadow)}}
@keyframes popin{0%{transform:scale(0) rotate(-20deg);opacity:0}18%{transform:scale(1.12);opacity:1}30%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8) translateY(-30px)}}
#select{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6%);text-align:center;
  font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,64px);line-height:1.1;color:#fff;
  text-shadow:0 3px 0 var(--sand-deep),0 6px 18px var(--shadow);text-wrap:balance;padding-inline:16px}
.pick{position:absolute;transform:translate(-50%,0);pointer-events:auto;padding:10px 20px;border-radius:26px;background:var(--glass);
  font-family:var(--display);font-weight:800;font-size:clamp(18px,4.4vw,26px);box-shadow:0 4px 0 var(--sand-deep),0 8px 16px var(--shadow);white-space:nowrap}
.pick:active{transform:translate(-50%,3px)}
#loading{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(18px,4.4vw,26px);color:#fff;text-shadow:0 2px 0 var(--sand-deep),0 4px 12px var(--shadow);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
#end{position:fixed;inset:0;display:grid;place-items:center;background:rgba(239,220,182,.35);padding-inline:16px}
.card{display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 24px;border-radius:32px;background:var(--glass);
  box-shadow:0 6px 0 var(--sand-deep),0 16px 40px var(--shadow);max-width:100%}
.bigstar{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:48px;direction:ltr;font-variant-numeric:tabular-nums}
.bigstar svg{width:68px;height:68px;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
#endmis{display:grid;grid-template-columns:repeat(3,48px);gap:12px}
#endmis .mi{width:48px;height:48px}
.row{display:flex;gap:18px}
.big{width:74px;height:74px}
@media (prefers-reduced-motion:reduce){.bigstar svg,#pop{animation:none}}
</style>

</head><body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="grp">
    <button class="round small" id="home" aria-label="الرئيسية"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3519" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/></svg></button>
    <button class="round small" id="gear" aria-label="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3519" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
    <button class="round small" id="albBtn" aria-label="دفتر السمك"><svg viewBox="0 0 24 24"><path d="M3 12c3.2-4.4 8.4-5.6 12.8-2.6L20 6.5v11l-4.2-2.9C11.4 17.6 6.2 16.4 3 12z" fill="#7fb3c8" stroke="#5a3519" stroke-width="1.6" stroke-linejoin="round"/><circle cx="7.2" cy="11.2" r="1.1" fill="#5a3519"/></svg></button>
    <button class="round small" id="snd" aria-label="الصوت"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3519" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h4l5-4v13l-5-4H4z" fill="#5a3519"/><path id="sndw" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  </div>
  <div class="grp"><div class="pill" id="racePill" hidden aria-label="السباق"><svg viewBox="0 0 24 24"><path d="M5 21V3" stroke="#5a3519" stroke-width="2" stroke-linecap="round"/><path d="M5 4h13l-3 4 3 4H5z" fill="#d2493a"/></svg><span id="raceTxt"></span></div><div class="pill" id="pearlPill" hidden aria-label="اللؤلؤ"><svg viewBox="0 0 24 24"><path d="M3 15c0-5 4-8.5 9-8.5s9 3.5 9 8.5c-2.5 1.5-5.6 2.3-9 2.3S5.5 16.5 3 15z" fill="#d9c7a8" stroke="#5a3519" stroke-width="1.3"/><circle cx="12" cy="13" r="2.8" fill="#fff" stroke="#5a3519" stroke-width="1.2"/></svg><span id="pearls">0</span></div><div class="pill" id="datesPill" hidden aria-label="الرطب"><svg viewBox="0 0 24 24"><ellipse cx="9" cy="13" rx="4" ry="6" fill="#b5651d" stroke="#6b3a12" stroke-width="1.2"/><ellipse cx="15.5" cy="12" rx="3.6" ry="5.6" fill="#c97a2a" stroke="#6b3a12" stroke-width="1.2"/><path d="M12 3c0 2.5-1 4-3 5M12 3c0 2.5 1.2 3.6 3.5 4" stroke="#6b8a3a" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span id="dates">0</span></div><div class="pill" aria-label="النجوم"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.2l-5.8 3.2 1.2-6.5L2.6 9.4l6.5-.8z" fill="#e6bf5c" stroke="#b98a2a" stroke-width="1.2" stroke-linejoin="round"/></svg><span id="stars">0/0</span></div></div>
</div>
<div class="pill" id="timer" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#5a3519" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2.5h6"/></svg><span id="tleft">3:00</span></div>
<div id="mis" hidden></div>
<canvas id="mini" hidden width="236" height="236"></canvas>

<div id="joy" hidden><div id="knob"></div></div>
<button class="round" id="jump" hidden aria-label="قفز"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3519" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14l7-7 7 7"/><path d="M5 20l7-7 7 7" opacity=".45"/></svg></button>
<button class="round" id="act" hidden aria-label="اركب"><svg id="acticon" viewBox="0 0 24 24"></svg></button>
<button class="round" id="sprint" hidden aria-label="سرعة"><svg viewBox="0 0 24 24"><path d="M13.5 2.5 5 13.5h6l-1.5 8 8.5-11h-6z" fill="#e6bf5c" stroke="#5a3519" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
<button class="round" id="fishBtn" hidden aria-label="صيد"><svg id="fishicon" viewBox="0 0 24 24"></svg></button>
<button class="round" id="power" hidden aria-label="القوة"><span class="cd"></span><svg id="powicon" viewBox="0 0 24 24"></svg></button>
<div id="pop" hidden></div>
<div id="fade"></div>

<div id="select">
  <div id="title">مغامرات عيال وليد</div>
  <button class="pick" data-k="saeedan">سيف</button>
  <button class="pick" data-k="khad">خدّوية</button>
  <button class="pick" data-k="saif">سعيدان</button>
  <div id="loading">لحظة… الشخصيات توصل</div>
  <button class="round small" id="gear2" aria-label="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3519" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
  <div id="lobby" hidden>
    <div class="ltitle">شو تبا تلعب؟</div>
    <div class="modes">
      <button class="mode on" data-m="adv">مغامرة<small>ساعد الحيوانات</small></button>
      <button class="mode" data-m="free">استكشاف حر<small>بدون مهمات</small></button>
      <button class="mode" data-m="stars">سباق النجوم<small>٣ دقايق</small></button>
    </div>
    <div class="lrow"><button class="lbtn" id="wardBtn">الملابس</button><button class="lbtn play" id="playBtn">العب</button></div>
  </div>
  <div id="ward" hidden>
    <div class="ltitle" id="wname">الملابس</div>
    <div class="wgrid" id="wgrid"></div>
    <div class="lrow"><button class="lbtn play" id="wardDone">تمام</button></div>
  </div>
</div>
<div id="catch" hidden></div>
<div id="album" hidden>
  <div class="card">
    <div class="ltitle">دفتر السمك</div>
    <div class="agrid" id="agrid"></div>
    <div class="lrow"><button class="lbtn play" id="albDone">تمام</button></div>
  </div>
</div>
<div id="bigmap" hidden>
  <div class="mapwrap">
    <canvas id="bigc" width="760" height="760"></canvas>
    <div class="mapnote">دوس على حيوان، ويدلّك عليه سهم ذهبي</div>
    <div class="places" id="places"></div>
    <button class="round small" id="mapDone" aria-label="سكّر الخريطة"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3519" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>
<div id="settings" hidden>
  <div class="card">
    <div class="ltitle">الإعدادات</div>

function animateKid(k, dt, t){

  if (k.sit){
    k.legs[0].rotation.x = k.legs[1].rotation.x = -1.35; k.legs[0].rotation.z = 0.35; k.legs[1].rotation.z = -0.35;

  }
  k.legs[0].rotation.z = k.legs[1].rotation.z = 0;
  if (k.air){
    k.legs[0].rotation.x = -0.6; k.legs[1].rotation.x = 0.3;

    k.arms[0].rotation.x = -s*0.6*amt + (idle ? 0.22 : 0); k.arms[1].rotation.x = s*0.6*amt + (idle ? 0.22 : 0) - (k.book ? 0.35 : 0);

}

const CLIPS = {idle: ['Idle_3', 'Idle_6', 'Idle_4', 'Idle_7'], walk: 'Walking', run: 'Running', sprint: 'RunFast', jump: 'Jump_Run', sit: 'Sitting_Clap', swimF: ['Swim_Forward', 'Swimming', 'Swim'], swimI: ['Swim_Idle', 'Treading_Water']};
function animateModel(k, dt, t){
  const g = k.g, sp = k.speed;
  let st = k.sit ? 'sit' : k.swim && g.a.swimF ? (sp > 0.5 || !g.a.swimI ? 'swimF' : 'swimI') : k.air ? 'jump' : sp > 8.5 ? 'sprint' : sp > 3.6 ? 'run' : sp > 0.35 ? 'walk' : 'idle';
  if (st === 'jump' && g.state !== 'jump'){ g.a.jump.reset(); g.a.jump.play(); }
  if (st === 'idle'){
    g.idleT += dt;
    if (g.idleT > 9){ g.idleI = (g.idleI + 1) % g.a.idle.length; g.idleT = 0; }
  } else g.idleT = 0;
  g.state = st;
  const target = {walk: 0, run: 0, sprint: 0, jump: 0, sit: 0}; if (g.a.swimF) target.swimF = 0; if (g.a.swimI) target.swimI = 0;
  if (st !== 'idle') target[st] = 1;

  g.a.walk.setEffectiveTimeScale(clamp(sp/2.6, 0.6, 1.6));
  g.a.run.setEffectiveTimeScale(clamp(sp/5.5, 0.8, 1.3));
  g.a.sprint.setEffectiveTimeScale(clamp(sp/10, 0.85, 1.25));
  if (g.a.swimF) g.a.swimF.setEffectiveTimeScale(clamp(sp/4, 0.8, 1.4));
  g.mixer.update(dt);
  if (g.thumb){
    if (S.mode === 'select' && !k.remote) for (const [b, q] of g.thumb.arm) b.quaternion.copy(q);   // thumbs-up pose, only when choosing
    else { for (const [b, q] of g.thumb.rest) b.quaternion.copy(q); g.thumb.t1.quaternion.copy(g.thumb.fold); }   // thumb folded during play
  }

    const want = (S.mode === 'select' && !k.remote) || (k === S.player && S.kidType === 'saeedan' && S.powerT > 0);
    if (want !== g.book.shown){ g.book.geo.setIndex(want ? g.book.full : g.book.no); g.book.shown = want; }
  }
  if (g.book && !(S.mode === 'select' && !k.remote)) fixArms(g);

}

const FQ = new T.Quaternion(), FQ2 = new T.Quaternion(), FQo = new T.Quaternion();
function fixArms(g){
  if (!g.armFix){ const ref = ['khad', 'saif'].map(k => kids[k] && kids[k].g).find(r => r && r.armRest.Left && r.armRest.Right); if (!ref || !g.armRest.Left || !g.armRest.Right) return;

function startHoubaraEnding(){

function updateEnding(dt, t){

    if (ft > 7) h.root.visible = false;

  if (e > 3.2) setCrouch(mother, Math.max(0, 1 - (e - 3.2)*2));
  if (e > 3.6 && e < 4.8) relEggs.forEach((m, j) => { m.rotation.z = Math.sin(t*30 + j)*0.3; });

    mother.root.position.addScaledVector(dir, 1.6*dt); mother.root.position.y = H(mother.root.position.x, mother.root.position.z);

  }

    const o = new T.Object3D();
    confP.forEach((c, i) => { c.p.addScaledVector(c.v, dt); c.r += dt*5; if (c.p.y < RELEASE.y) c.p.y = RELEASE.y + 10; o.position.copy(c.p); o.rotation.set(c.r, c.r*0.7, 0); o.updateMatrix(); confIM.setMatrixAt(i, o.matrix); });

    if (near){ x = S.pos.x + Math.cos(u.i*2.1)*2.2; z = S.pos.z + Math.sin(u.i*2.1)*2.2; }
    else { u.a += dt*0.12; x = ISLAND[0] + Math.cos(u.a)*(32 + u.i*4); z = ISLAND[1] + Math.sin(u.a)*(32 + u.i*4); }
    const px = P.x, pz = P.z; P.x = lerp(P.x, x, Math.min(1, dt*(near ? 1.5 : 1))); P.z = lerp(P.z, z, Math.min(1, dt*(near ? 1.5 : 1)));
    P.y = Math.max(groundAt(P.x, P.z, 0) + 0.3, WATER_Y - 0.9 + Math.sin(t + u.i)*0.15);
    if (Math.hypot(P.x - px, P.z - pz) > 1e-3) u.root.rotation.y = Math.atan2(P.x - px, P.z - pz); u.root.rotation.z = Math.sin(t*1.5 + u.i)*0.08; });
}
function resetFun2(){
  if (S.race) endRace(false); S.race = null; placeRacers(); S.kite = false; S.pearls = 0; $('pearls').textContent = '0'; $('pearlPill').hidden = true;
  pearlObjs.forEach(o => { o.got = false; o.g.visible = true; });
  horse.root.position.set(HORSE_HOME[0], H(HORSE_HOME[0], HORSE_HOME[1]), HORSE_HOME[1]); horse.root.rotation.y = -0.6; horseCol.x = HORSE_HOME[0]; horseCol.z = HORSE_HOME[1]; horseCol.r = 1.0;
}
function farHide(){   // keep the heavy animals off the screen when the kid is far away (saves the iPad)
  musandam.root.visible = !S.indoor && Math.hypot(S.pos.x - 150, S.pos.z + 520) < 360;
  wadi.root.visible = !S.indoor && Math.hypot(S.pos.x + 240, S.pos.z + 200) < 400;
  { const far = S.indoor || Math.hypot(S.pos.x - DIBBA.x, S.pos.z - DIBBA.z) > 300; dibba.root.visible = dibba.mi.visible = !far; }
  const P = S.pos, dT = Math.hypot(P.x - TRACK.x, P.z - TRACK.z); racers.forEach(r => r.c.root.visible = !r.hidden && (dT < 110 || !!S.race));
  gazelles.forEach(g => g.root.visible = Math.hypot(P.x - g.root.position.x, P.z - g.root.position.z) < 130);
  dolphins.forEach(d => d.root.visible = Math.hypot(P.x - d.root.position.x, P.z - d.root.position.z) < 160);
  turtles.forEach(u => u.root.visible = Math.hypot(P.x - u.root.position.x, P.z - u.root.position.z) < 120);
}
function updateFun2(dt, t){ if ((miniTick & 15) === 0) farHide(); updateRace(dt); updateKite(dt, t); updatePearls(dt, t); updateGazelles(dt, t); updateDolphins(dt, t); updateTurtles(dt, t); updateWadi(dt, t); if (S.ride !== 'horse') walkLegs(horse.legs, 0, 0); }

/* ================= loop ================= */
let lastT = performance.now(), acc = 0, frames = 0, slow = 0, fast = 0, miniTick = 0;
/* ================= play together: everyone who opens the game lands in the same world =================
   The first device to open takes a fixed meeting name on the free PeerJS service and relays; everyone else connects to it.
   Each device sends its own kid's state 10 times a second; if the relay leaves, another device takes over. */
const NET = {peer: null, host: false, conns: [], remotes: new Map(), sendT: 0, retry: 0, id: Math.random().toString(36).slice(2, 10)};
const FAM = (function(){ let f = null; try { f = new URLSearchParams(location.search).get('w'); if (f) localStorage.setItem('saeedan_fam', f); else f = localStorage.getItem('saeedan_fam'); } catch(e){} return f && /^[a-z0-9]{6,40}$/i.test(f) ? f.toLowerCase() : null; })();
const WORLD = FAM ? 'imkid963-fam-' + FAM : null;   // no family link on this device = plays alone
function netHas(type){ for (const r of NET.remotes.values()) if (r.type === type && r.pl) return true; return false; }
function netSend(msg){ msg.from = msg.from || NET.id; const s = JSON.stringify(msg); NET.conns.forEach(c => { if (c.open) try { c.send(s); } catch(e){} }); }
function netOnData(conn, raw){
  let m; try { m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch(e){ return; }
  if (!m || m.from === NET.id) return;
  if (NET.host) NET.conns.forEach(c => { if (c !== conn && c.open) try { c.send(JSON.stringify(m)); } catch(e){} });   // relay to the others
  if (m.t === 's') netState(m);
  else if (m.t === 'bye') netDrop(m.from);
  else if (m.t === 'fire') setFire(!!m.on, true, m.id || 0);
}
function netConn(c){
  NET.conns.push(c);
  c.on('data', d => netOnData(c, d));
  const gone = () => { NET.conns = NET.conns.filter(x => x !== c); if (!NET.host){ NET.remotes.forEach((r, id) => netDrop(id)); netRestart(); } };
  c.on('close', gone); c.on('error', gone);
}
function netRestart(){ try { NET.peer && NET.peer.destroy(); } catch(e){} NET.peer = null; NET.host = false; NET.conns = []; clearTimeout(NET.retry); NET.retry = setTimeout(netHost, 800 + Math.random()*2500); }
function netHost(){
  if (!window.Peer || !WORLD) return;
  let p; try { p = new Peer(WORLD, {debug: 0}); } catch(e){ return; }
  p.on('open', () => { NET.peer = p; NET.host = true; });
  p.on('connection', c => netConn(c));
  p.on('error', e => {
    if (e.type === 'unavailable-id'){ try { p.destroy(); } catch(_){} netJoin(); }
    else if (!NET.peer || NET.peer === p){ try { p.destroy(); } catch(_){} NET.peer = null; clearTimeout(NET.retry); NET.retry = setTimeout(netHost, 6000 + Math.random()*4000); }
  });
  p.on('disconnected', () => { try { p.reconnect(); } catch(_){} });
}
function netJoin(){
  let p; try { p = new Peer({debug: 0}); } catch(e){ return; }
  p.on('open', () => { NET.peer = p; NET.host = false; const c = p.connect(WORLD, {serialization: 'json'});
    const to = setTimeout(() => { if (!c.open && NET.peer === p) netRestart(); }, 10000);
    c.on('open', () => { clearTimeout(to); netConn(c); }); c.on('error', () => { clearTimeout(to); if (!c.open && NET.peer === p) netRestart(); }); });
  p.on('error', e => { if (NET.peer === p || !NET.peer){ netRestart(); } });
}
function nameTag(type){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64; const g = cv.getContext('2d');
  g.fillStyle = 'rgba(255,250,240,.92)'; g.beginPath(); g.roundRect ? g.roundRect(8, 6, 240, 52, 26) : g.rect(8, 6, 240, 52); g.fill();
  g.fillStyle = '#5a3519'; g.font = '800 34px Tajawal, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl'; g.fillText(KNAME[type] || '', 128, 34);
  const tx = new T.CanvasTexture(cv); tx.encoding = T.sRGBEncoding;
  const sp = new T.Sprite(new T.SpriteMaterial({map: tx, depthTest: false, transparent: true})); sp.scale.set(1.2, 0.3, 1); sp.position.y = 2.05; sp.renderOrder = 5; return sp;
}
function netState(m){
  if (!GLB[m.k]) return;
  let r = NET.remotes.get(m.from);
  if (r && r.type !== m.k){ netDrop(m.from); r = null; }
  if (!r && m.pl === 0) return;   // still choosing: nothing to load yet
  if (!r){
    const k = buildKid(m.k); k.remote = true; k.outfit = m.o || {}; scene.add(k.root);
    k.root.add(nameTag(m.k));
    loadKidModel(m.k, k, () => {}, kk => kk.prim.forEach(o => o.visible = true));
    r = {type: m.k, k, tgt: new T.Vector3(m.x, m.y, m.z), h: m.h || 0, seen: 0}; NET.remotes.set(m.from, r);
    k.root.position.copy(r.tgt);
    FIRES.forEach((F, id) => { if (F.on) netSend({t: 'fire', on: true, id}); });   // a newcomer sees the campfire already burning
  }
  r.tgt.set(m.x, m.y, m.z); r.h = m.h || 0; r.sp = m.sp || 0; r.sw = !!m.sw; r.air = !!m.a; r.seen = performance.now();
  r.ride = typeof m.r === 'string' && VEH_SRC[m.r] ? m.r : 0; r.pl = m.pl !== 0;
  if (r.ride){ r.vt = r.vt || new T.Vector3(); r.vt.set(m.vx, m.vy, m.vz); r.vh = m.vh || 0; }
  r.k.root.visible = r.pl && r.ride !== 'car';
  if (JSON.stringify(m.o || {}) !== JSON.stringify(r.k.outfit || {})){ r.k.outfit = m.o || {}; try { applyOutfit(r.k); } catch(e){} }
}
function netDrop(id){
  const r = NET.remotes.get(id); if (!r) return; scene.remove(r.k.root); NET.remotes.delete(id);
  if (r.veh) Object.values(r.veh).forEach(v => scene.remove(v));
  // free the GPU memory of this remote's own model (its skinned body + textures) and name tag
  r.k.root.traverse(o => { if (o.isSprite){ if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  if (r.k.g){ try { r.k.g.mixer.stopAllAction(); r.k.g.mixer.uncacheRoot(r.k.g.o); } catch(e){}
    r.k.g.o.traverse(o => { if (o.isSkinnedMesh){ o.geometry.dispose(); if (o.material.map) o.material.map.dispose(); if (o.material.normalMap) o.material.normalMap.dispose(); o.material.dispose(); if (o.skeleton) o.skeleton.dispose(); } }); }
}
const VEH_SRC = {car: () => car.root, camel: () => camel.root, boat: () => boat.root, horse: () => horse.root};
function updateNet(dt, t){
  if (!NET.peer) return;
  netAnimate(dt, t);
}
function netTick(){   // runs on a timer, so a device keeps announcing itself even when its screen isn't redrawing
  if (!NET.peer || !NET.conns.length) return;
  {
    const p = S.player && S.player.root.position;
    if ((S.mode === 'play' || S.mode === 'ending') && p){
      const q = S.ride === 'car' ? S.pos : p, msg = {t: 's', k: S.kidType, x: +q.x.toFixed(2), y: +q.y.toFixed(2), z: +q.z.toFixed(2), h: +S.heading.toFixed(2), sp: +(S.player.speed || 0).toFixed(1), sw: S.player.swim ? 1 : 0, a: S.player.air ? 1 : 0, r: S.ride || 0, o: outfits[S.kidType] || {}, pl: 1};
      if (S.ride){ const v = VEH_SRC[S.ride]().position; msg.vx = +v.x.toFixed(2); msg.vy = +v.y.toFixed(2); msg.vz = +v.z.toFixed(2); msg.vh = +(S.ride === 'car' ? car.yaw : S.ride === 'boat' ? boat.yaw : S.heading).toFixed(2); }
      netSend(msg);
    }
    else netSend({t: 's', k: selKid || 'saeedan', x: 0, y: -50, z: 0, h: 0, pl: 0});
  }
}
setInterval(netTick, 100);
function netAnimate(dt, t){
  const now = performance.now();
  NET.remotes.forEach((r, id) => {
    if (now - r.seen > 6000){ netDrop(id); return; }
    const k = r.k, P = k.root.position;
    if (P.distanceTo(r.tgt) > 25) P.copy(r.tgt); else P.lerp(r.tgt, Math.min(1, dt*10));
    k.root.rotation.y += angDiff(k.root.rotation.y, r.h)*Math.min(1, dt*10);
    k.speed = r.ride ? 0 : r.sp; k.swim = !r.ride && r.sw; k.air = !r.ride && r.air; k.sit = r.ride === 'camel' || r.ride === 'horse';
    animateKid(k, dt, t);
    // their car / camel / boat (a look-alike copy, so everyone sees what they ride)
    r.veh = r.veh || {};
    for (const v in VEH_SRC){ const on = r.ride === v && r.pl; if (on && !r.veh[v]){ r.veh[v] = VEH_SRC[v]().clone(true); r.veh[v].visible = false; scene.add(r.veh[v]); }
      if (r.veh[v]){ r.veh[v].visible = on; if (on){ const V = r.veh[v]; if (!V.userData.placed || V.position.distanceTo(r.vt) > 25){ V.position.copy(r.vt); V.userData.placed = true; } else V.position.lerp(r.vt, Math.min(1, dt*10)); V.rotation.y += angDiff(V.rotation.y, r.vh)*Math.min(1, dt*10); } } }
  });
}
addEventListener('pagehide', () => { netSend({t: 'bye'}); try { NET.peer && NET.peer.destroy(); } catch(e){} });
if (WORLD) setTimeout(netHost, 600);

function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - lastT)/1000; lastT = now; if (dt > 0.1) dt = 0.1;
  const t = now/1000;
  if (S.mode === 'select') updateSelect(dt, t); else if (S.mode === 'play'){ if ($('settings').hidden && $('album').hidden && $('bigmap').hidden) updatePlay(dt, t); } else updateEnding(dt, t);
  updateWorld(dt, t); updateNet(dt, t); updateEngine();
  camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.render(scene, camera);
  if (S.mode !== 'select' && (miniTick++ & 1) === 0) drawMini();
  acc += dt; frames++;
  if (acc > 2){
    const fps = frames/acc; acc = 0; frames = 0;
    // keep it smooth: step down (sharpness → shadows → how far you see) while it is slow, step sharpness back up when there is room
    if (fps < 40){ slow++; fast = 0;
      if (pr > 1.25){ pr = Math.max(1.25, pr - 0.2); renderer.setPixelRatio(pr); resize(); }
      else if (slow > 2 && renderer.shadowMap.enabled){ renderer.shadowMap.enabled = false; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); }
      else if (slow > 4 && pr > 1){ pr = 1; renderer.setPixelRatio(pr); resize(); }
      else if (slow > 5 && camera.far > 700){ camera.far = 700; camera.updateProjectionMatrix(); scene.fog.near = 110; scene.fog.far = 640; window.__dome.scale.setScalar(0.42); window.__sun.userData.off.multiplyScalar(0.62); window.__sun.scale.setScalar(1.5); } }   // the sky shrinks with the view distance so it stays daytime
    else if (fps > 56 && SET.q !== 'low'){ if (++fast >= 3 && pr < maxPR){ fast = 0; pr = Math.min(maxPR, pr + 0.15); renderer.setPixelRatio(pr); resize(); } }
    else fast = 0;
  }
}
resize(); resetWorld(); placeSelect(); applySettings();
requestAnimationFrame(loop);
})();
